<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="fav-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="fav-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="fav-leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="40%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
  </defs>

  <!-- Left Loop Inner Shadow Fold -->
  <path d="M 45 45 C 30 55 24 75 35 92 C 45 106 65 110 80 102 C 65 92 52 82 48 68 C 45 58 48 50 45 45 Z" fill="url(#fav-shadow)" />

  <!-- Left Main Curving Ribbon -->
  <path d="M 95 62 C 72 28 35 24 18 48 C 2 72 14 112 52 116 C 75 118 92 100 105 82 C 88 100 68 102 46 95 C 24 88 16 68 26 50 C 38 32 68 34 88 56 Z" fill="url(#fav-ribbon)" />

  <!-- Center Cross Underpass -->
  <path d="M 88 56 C 98 70 108 82 122 96 C 114 102 102 104 92 98 C 84 92 82 82 88 56 Z" fill="url(#fav-shadow)" />

  <!-- Right Upper Main Leaf -->
  <path d="M 102 65 C 112 44 130 24 165 18 C 178 16 186 20 186 24 C 184 38 170 60 148 76 C 132 88 116 88 102 65 Z" fill="url(#fav-leaf)" />
  <!-- Center Vein -->
  <path d="M 112 62 Q 138 46 174 24" stroke="#DCFCE7" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Right Under-leaf Arc -->
  <path d="M 124 88 C 145 78 168 76 182 85 C 168 106 142 122 114 114 C 104 110 98 100 106 88 Z" fill="url(#fav-ribbon)" />
  <path d="M 126 92 C 144 86 162 86 172 90" stroke="#BBF7D0" stroke-width="2" stroke-linecap="round" opacity="0.75" />
</svg>
